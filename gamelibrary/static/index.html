<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Library</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --surface: #ffffff;
        --text: #1c1c1a;
        --muted: #6b6b66;
        --border: #e2e2dd;
        --accent: #2f5fd0;
        --st-playing: #c9810a;
        --st-played: #2e7d4f;
        --st-backlog: #2f5fd0;
        --st-replay: #0e8a8a;
        --st-dropped: #b3402f;
        --st-multiplayer: #b02a7c;
        --st-endless: #5f8a1e;
        --st-unplayed: #6b7a8c;
        --star: #d99a00;
        --steam: #2a475e;
        --gog: #8a3fc7;
        --epic: #2b2b2b;
        --battlenet: #0a7bd4;
        --amazon: #e07b00;
        --other: #6b6b66;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141416;
          --surface: #1d1d20;
          --text: #ececea;
          --muted: #9a9a94;
          --border: #2e2e33;
          --accent: #7a9cf0;
          --st-playing: #f0b04a;
          --st-played: #5cc488;
          --st-backlog: #7a9cf0;
          --st-replay: #4cc9c9;
          --st-dropped: #f0806e;
          --st-multiplayer: #ee7fc0;
          --st-endless: #a6d15c;
          --st-unplayed: #9fb0c4;
          --star: #f5c04a;
          --steam: #66a3d6;
          --gog: #b77ee8;
          --epic: #b8b8b8;
          --battlenet: #4aa3f0;
          --amazon: #f0a030;
          --other: #9a9a94;
        }
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 24px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      .stats {
        color: var(--muted);
        font-size: 14px;
      }
      .stats b {
        color: var(--text);
        font-weight: 600;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--bg);
        padding: 8px 0 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }
      input[type="search"],
      select {
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 10px;
      }
      input[type="search"] {
        flex: 1 1 220px;
        min-width: 0;
      }
      .chip {
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 5px 11px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .chip[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .chip .n {
        color: var(--muted);
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--c, var(--other));
        flex: none;
      }
      .toolbar .label {
        font-size: 13px;
        color: var(--muted);
      }
      .toolbar .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        width: 100%;
      }

      .count {
        color: var(--muted);
        font-size: 13px;
        margin: 12px 0 8px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      details {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      summary {
        list-style: none;
        cursor: pointer;
        padding: 10px 14px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      .title {
        flex: 1 1 240px;
        font-weight: 500;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 7px;
      }
      .dup {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
      }
      .hours {
        font-size: 13px;
        color: var(--muted);
        min-width: 52px;
        text-align: right;
      }
      .entries {
        border-top: 1px solid var(--border);
        padding: 6px 14px 10px;
        display: grid;
        gap: 4px;
        font-size: 14px;
      }
      .entry {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        align-items: center;
      }
      .entry .t {
        flex: 1 1 240px;
      }
      .entry a {
        color: var(--accent);
        text-decoration: none;
      }
      .entry a:hover {
        text-decoration: underline;
      }
      .thumb {
        width: 40px;
        height: 54px;
        border-radius: 4px;
        object-fit: cover;
        flex: none;
        background: var(--border);
      }
      .ph {
        display: grid;
        place-items: center;
        background: var(--border);
        color: var(--muted);
        font-weight: 600;
      }
      summary {
        padding: 8px 14px 8px 8px;
      }
      ul.grid {
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 14px;
      }
      .card {
        all: unset;
        box-sizing: border-box;
        cursor: pointer;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .card:focus-visible {
        outline: 2px solid var(--accent);
      }
      .card .cover {
        position: relative;
        aspect-ratio: 2 / 3;
        background: var(--border);
      }
      .card .cover img,
      .card .cover .ph {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: grid;
      }
      .card .cover .ph {
        font-size: 32px;
      }
      .card .badges {
        position: absolute;
        left: 6px;
        bottom: 6px;
        right: 6px;
        gap: 4px;
      }
      .card .badge {
        background: color-mix(in srgb, var(--surface) 88%, transparent);
      }
      .card .title {
        /* margin, not padding: overflow:hidden clips at the padding edge, so padding
           would let the clipped third line show through underneath. */
        margin: 8px 10px;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.35;
        min-height: 2.7em; /* always two lines, so cards in a row line up */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      /* Covers that aren't portrait: show the whole image over a blurred copy of itself. */
      .card .cover.fit {
        overflow: hidden;
      }
      .card .cover.fit::before {
        content: "";
        position: absolute;
        inset: -16px;
        background: var(--cover-bg) center / cover no-repeat;
        filter: blur(14px) brightness(0.55);
      }
      .card .cover.fit img {
        position: relative;
        object-fit: contain;
      }
      .thumb.fit {
        object-fit: contain;
      }
      dialog {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0;
        width: min(560px, calc(100vw - 32px));
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      .dlg-head {
        display: flex;
        gap: 14px;
        padding: 16px;
        align-items: flex-start;
      }
      .dlg-head .thumb {
        width: 90px;
        height: 120px;
      }
      .dlg-head h2 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      dialog .entries {
        border-top: 1px solid var(--border);
        padding: 12px 16px 16px;
      }
      .close {
        margin-left: auto;
        font: inherit;
        background: none;
        border: 0;
        color: var(--muted);
        cursor: pointer;
        font-size: 18px;
      }
      .hide-btn {
        font: inherit;
        font-size: 13px;
        color: var(--muted);
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 9px;
        cursor: pointer;
        margin-top: 6px;
        justify-self: start;
      }
      .hide-btn:hover {
        color: var(--text);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
        justify-self: start;
      }
      .actions .hide-btn {
        margin-top: 0;
      }
      .hide-btn.remove:hover {
        color: var(--st-dropped);
        border-color: var(--st-dropped);
      }
      .is-hidden {
        opacity: 0.55;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        border-radius: 6px;
        padding: 2px 7px;
      }
      .tag button {
        all: unset;
        cursor: pointer;
        opacity: 0.6;
        line-height: 1;
      }
      .tag button:hover {
        opacity: 1;
      }
      .tagline {
        display: block;
        padding: 0 10px 8px;
        font-size: 12px;
        color: var(--accent);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tags-edit {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-top: 8px;
      }
      .tag-input {
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        border: 1px dashed var(--border);
        border-radius: 6px;
        padding: 3px 8px;
        width: 120px;
      }
      .status {
        display: inline-flex;
        font-size: 12px;
        font-weight: 500;
        color: var(--c);
        border: 1px solid var(--c);
        border-radius: 6px;
        padding: 1px 7px;
        background: color-mix(in srgb, var(--surface) 90%, transparent);
      }
      .card .status-stack {
        position: absolute;
        top: 6px;
        left: 6px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
      }
      .status-pick {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .status-pick .chip[aria-pressed="true"] {
        border-color: var(--c);
        color: var(--c);
        box-shadow: inset 0 0 0 1px var(--c);
      }
      header {
        justify-content: space-between;
      }
      .add-btn {
        margin-left: auto;
      }
      .dates {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-bottom: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .dates label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .date-input,
      .cover-edit input[type="url"],
      .add-form input,
      .add-form select {
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
      }
      .cover-edit {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .cover-edit input[type="url"] {
        flex: 1 1 160px;
        min-width: 0;
      }
      .cover-options {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .cover-opt {
        all: unset;
        cursor: pointer;
        border: 2px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
        background: var(--border);
        line-height: 0;
      }
      .cover-opt[aria-pressed="true"] {
        border-color: var(--accent);
      }
      .cover-opt:focus-visible {
        outline: 2px solid var(--accent);
      }
      .cover-opt img {
        height: 84px;
        max-width: 150px;
        object-fit: contain;
      }
      .add-form {
        padding: 18px;
        display: grid;
        gap: 12px;
      }
      .add-form h2 {
        margin: 0;
        font-size: 18px;
      }
      .add-form .hint {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      .add-form label {
        display: grid;
        gap: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .add-form input,
      .add-form select {
        width: 100%;
        font-size: 14px;
        padding: 7px 10px;
      }
      .add-form .error {
        margin: 0;
        font-size: 13px;
        color: var(--st-dropped);
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .chip.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
      }
      .ratingline {
        display: block;
        padding: 0 10px 4px;
        font-size: 12px;
        color: var(--star);
        white-space: nowrap;
      }
      .rating {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-bottom: 8px;
      }
      /* A star is two invisible buttons side by side: the left half is x.5, the right half is x. */
      .rating .star {
        position: relative;
        display: inline-block;
        font-size: 22px;
        line-height: 1;
        padding: 0 1px;
        color: var(--border);
      }
      .rating .star.on {
        color: var(--star);
      }
      .rating .star.half {
        background: linear-gradient(90deg, var(--star) 50%, var(--border) 50%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .rating .star button {
        all: unset;
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        cursor: pointer;
      }
      .rating .star .hl {
        left: 0;
      }
      .rating .star .hr {
        right: 0;
      }
      .rating .star button:focus-visible {
        outline: 2px solid var(--accent);
        border-radius: 3px;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin-bottom: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .facts label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .facts input {
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
      }
      .dev-input {
        width: 210px;
      }
      .hours-input {
        width: 84px;
      }
      .fact-note {
        font-size: 12px;
      }
      .dev-line {
        font-size: 13px;
        color: var(--muted);
        margin-top: 2px;
      }
      .rating .n {
        font-size: 13px;
        color: var(--muted);
        margin-left: 6px;
      }
      .note-input {
        display: block;
        width: 100%;
        margin-top: 10px;
        font: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        resize: vertical;
        min-height: 72px;
      }
      .link-btn {
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
      }
      .link-btn:hover {
        color: var(--text);
      }
      .empty {
        color: var(--muted);
        padding: 32px 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Game Library</h1>
        <div class="stats" id="stats"></div>
        <button class="chip add-btn" id="addBtn">+ Adicionar jogo</button>
      </header>

      <div class="toolbar">
        <div class="row">
          <input
            type="search"
            id="search"
            placeholder="Buscar jogo…"
            autofocus
          />
          <select id="sort" aria-label="Ordenar">
            <option value="title">Nome</option>
            <option value="platforms">Mais plataformas</option>
            <option value="playtime">Mais horas jogadas</option>
            <option value="recent">Jogado recentemente</option>
            <option value="rating">Melhor avaliados</option>
          </select>
          <button class="chip" id="dupOnly" aria-pressed="false">
            Só repetidos
          </button>
          <button class="chip" id="showHidden" aria-pressed="false">
            Mostrar ocultos <span class="n" id="hiddenCount"></span>
          </button>
          <span class="row" style="width: auto; gap: 0">
            <button
              class="chip"
              id="viewList"
              aria-pressed="false"
              style="border-radius: 999px 0 0 999px"
            >
              Lista
            </button>
            <button
              class="chip"
              id="viewGrid"
              aria-pressed="true"
              style="border-radius: 0 999px 999px 0; margin-left: -1px"
            >
              Grade
            </button>
          </span>
        </div>
        <div class="row">
          <span class="label">Tenho em:</span>
          <span id="platformChips" class="row" style="width: auto"></span>
        </div>
        <div class="row">
          <span class="label">Status:</span>
          <span id="statusChips" class="row" style="width: auto"></span>
        </div>
        <div class="row" id="tagRow" hidden>
          <span class="label">Tags:</span>
          <span id="tagChips" class="row" style="width: auto"></span>
        </div>
      </div>

      <div class="count" id="count"></div>
      <datalist id="taglist"></datalist>
      <ul id="list"></ul>
    </main>
    <dialog id="dlg"></dialog>
    <dialog id="addDlg">
      <form id="addForm" class="add-form">
        <h2>Adicionar jogo</h2>
        <p class="hint">
          Para jogos que o sync não traz (outras lojas, consoles, jogos
          compartilhados…). Vale também para Steam, GOG e Epic: o sync dessas
          lojas não apaga o que você adiciona aqui. O jogo é salvo em
          data/manual.json.
        </p>
        <label
          >Plataforma
          <select id="addPlatform"></select
        ></label>
        <label id="addOtherWrap" hidden>
          Nome da plataforma <input id="addOther" maxlength="30" />
        </label>
        <label>Título <input id="addTitle" required maxlength="200" /></label>
        <label>
          Link da capa (opcional)
          <input id="addCover" type="url" placeholder="https://…" />
        </label>
        <label>
          Horas jogadas (opcional)
          <input id="addHours" type="number" min="0" step="any" />
        </label>
        <label>
          Link da loja (opcional) <input id="addUrl" type="url" />
        </label>
        <p class="error" id="addError" role="alert" hidden></p>
        <div class="form-actions">
          <button type="button" class="chip" id="addCancel">Cancelar</button>
          <button type="submit" class="chip primary">Adicionar</button>
        </div>
      </form>
    </dialog>

    <script>
      const PLATFORM_NAMES = {
        steam: "Steam",
        gog: "GOG",
        epic: "Epic",
        battlenet: "Battle.net",
        amazon: "Amazon Games",
      };
      const name = (p) =>
        PLATFORM_NAMES[p] || p.replace(/\b\w/g, (c) => c.toUpperCase());
      const color = (p) => `var(--${PLATFORM_NAMES[p] ? p : "other"})`;
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const hours = (m) =>
        m ? (m >= 600 ? Math.round(m / 60) : (m / 60).toFixed(1)) + " h" : "";

      // Ratings are stored as 1-10 (half stars): 7 means 3.5 stars.
      const starsText = (r) =>
        "★".repeat(Math.floor(r / 2)) + (r % 2 ? "½" : "");
      const ratingText = (r) => (r / 2).toLocaleString("pt-BR");
      const hoursValue = (g) =>
        g.playtime_minutes != null
          ? String(+(g.playtime_minutes / 60).toFixed(2))
          : "";
      const devNote = (g) =>
        g.developer_custom
          ? "editado" +
            (g.developer_auto ? ` (automático: ${g.developer_auto})` : "")
          : g.developer_auto
            ? "automático"
            : "";
      const hoursNote = (g) =>
        g.playtime_custom
          ? "editado" +
            (g.playtime_auto != null
              ? ` (automático: ${hours(g.playtime_auto)})`
              : "")
          : g.playtime_auto != null
            ? "automático"
            : "";

      let groups = [];
      const selected = new Set();
      let dupOnly = false;
      let showHidden = false;
      const selectedTags = new Set();
      const selectedStatus = new Set(); // all-of (like tags); "none" is exclusive
      const STATUSES = [
        ["playing", "Jogando"],
        ["played", "Jogado"],
        ["backlog", "Para jogar"],
        ["replay", "Para jogar novamente"],
        ["dropped", "Abandonado"],
        ["multiplayer", "Multiplayer/Co-op"],
        ["endless", "Sem fim"],
        ["unplayed", "Não jogado"],
      ];
      const statusLabel = (k) => (STATUSES.find((s) => s[0] === k) || [])[1];
      let tagCase = new Map(); // lowercase -> spelling already in use
      let dlgKey = null;
      let view = "grid";
      let byKey = new Map();

      const $ = (id) => document.getElementById(id);

      function renderTagChips() {
        const counts = {};
        for (const g of shown())
          for (const t of g.tags) counts[t] = (counts[t] || 0) + 1;
        for (const t of [...selectedTags])
          if (!counts[t]) selectedTags.delete(t); // tag no longer exists
        tagCase = new Map(
          groups.flatMap((g) => g.tags).map((t) => [t.toLowerCase(), t]),
        );
        $("taglist").innerHTML = [...new Set(groups.flatMap((g) => g.tags))]
          .sort()
          .map((t) => `<option value="${esc(t)}">`)
          .join("");
        const names = Object.keys(counts).sort((a, b) => a.localeCompare(b));
        $("tagRow").hidden = !names.length;
        $("tagChips").innerHTML = names
          .map(
            (t) =>
              `<button class="chip" data-t="${esc(t)}" aria-pressed="${selectedTags.has(t)}">${esc(t)} <span class="n">${counts[t]}</span></button>`,
          )
          .join("");
      }

      // "Mostrar ocultos" swaps the list: only hidden games, not mixed with the others.
      const shown = () => groups.filter((g) => g.hidden === showHidden);

      function renderStatusChips() {
        const counts = {};
        for (const g of shown())
          for (const k of g.statuses.length ? g.statuses : ["none"])
            counts[k] = (counts[k] || 0) + 1;
        $("statusChips").innerHTML = [...STATUSES, ["none", "Sem status"]]
          .map(
            ([k, label]) =>
              `<button class="chip" data-s="${k}" aria-pressed="${selectedStatus.has(k)}" style="--c:var(--st-${k}, var(--muted))">
       ${k === "none" ? "" : '<span class="dot"></span>'}${label} <span class="n">${counts[k] || 0}</span></button>`,
          )
          .join("");
      }

      function renderChips() {
        const counts = {};
        for (const g of shown())
          for (const p of g.platforms) counts[p] = (counts[p] || 0) + 1;
        $("platformChips").innerHTML = Object.keys(counts)
          .sort()
          .map(
            (p) =>
              `<button class="chip" data-p="${esc(p)}" aria-pressed="${selected.has(p)}" style="--c:${color(p)}">
       <span class="dot"></span>${esc(name(p))} <span class="n">${counts[p]}</span></button>`,
          )
          .join("");
        renderStatusChips();
        renderTagChips();
      }

      function renderStats() {
        const list = groups.filter((g) => !g.hidden);
        const hiddenN = groups.length - list.length;
        $("hiddenCount").textContent = hiddenN || "";
        const dups = list.filter((g) => g.platforms.length > 1).length;
        const entries = list.reduce((n, g) => n + g.entries.length, 0);
        $("stats").innerHTML =
          `<b>${list.length}</b> jogos únicos · <b>${entries}</b> licenças · <b>${dups}</b> em mais de uma plataforma`;
      }

      function visible() {
        const q = $("search").value.trim().toLowerCase();
        let list = shown().filter(
          (g) =>
            (!dupOnly || g.platforms.length > 1) &&
            [...selected].every((p) => g.platforms.includes(p)) &&
            [...selectedTags].every((t) => g.tags.includes(t)) &&
            (!selectedStatus.size ||
              (selectedStatus.has("none")
                ? !g.statuses.length
                : [...selectedStatus].every((s) => g.statuses.includes(s)))) &&
            (!q ||
              g.entries.some((e) => e.title.toLowerCase().includes(q)) ||
              g.title.toLowerCase().includes(q) ||
              g.tags.some((t) => t.toLowerCase().includes(q)) ||
              g.note.toLowerCase().includes(q) ||
              g.developer.toLowerCase().includes(q)),
        );
        const sort = $("sort").value;
        const by = {
          title: (a, b) => a.title.localeCompare(b.title),
          platforms: (a, b) =>
            b.platforms.length - a.platforms.length ||
            a.title.localeCompare(b.title),
          playtime: (a, b) =>
            (b.playtime_minutes || 0) - (a.playtime_minutes || 0),
          recent: (a, b) => (b.last_played || 0) - (a.last_played || 0),
          rating: (a, b) =>
            (b.rating || 0) - (a.rating || 0) || a.title.localeCompare(b.title),
        };
        return list.sort(by[sort]);
      }

      function coverHtml(g, cls) {
        const src = g.covers[0];
        if (!src)
          return `<div class="${cls} ph">${esc(g.title[0] || "?")}</div>`;
        return `<img class="${cls}" loading="lazy" alt="" src="${esc(src)}" data-key="${esc(g.key)}" data-i="0">`;
      }

      // Portrait covers fill the card. Anything wider is shown whole over a blurred backdrop.
      function fitCover(img) {
        const wide = img.naturalWidth / img.naturalHeight > 0.8;
        img.classList.toggle("fit", wide);
        const box = img.closest(".cover");
        if (!box) return;
        box.classList.toggle("fit", wide);
        if (wide)
          box.style.setProperty(
            "--cover-bg",
            `url(${JSON.stringify(img.currentSrc || img.src)})`,
          );
      }
      document.addEventListener(
        "load",
        (e) => {
          if (e.target instanceof HTMLImageElement && e.target.dataset.key)
            fitCover(e.target);
        },
        true,
      );
      // Images already loaded (cache) may not fire "load" again after a re-render.
      const fitLoadedCovers = () =>
        document
          .querySelectorAll("img[data-key]")
          .forEach((img) => img.complete && img.naturalWidth && fitCover(img));

      // A cover that fails to load falls through to the next platform's cover, then to a placeholder.
      document.addEventListener(
        "error",
        (e) => {
          const img = e.target;
          if (!(img instanceof HTMLImageElement) || !img.dataset.key) return;
          const g = byKey.get(img.dataset.key);
          const next = g && g.covers[Number(img.dataset.i) + 1];
          if (next) {
            img.dataset.i = Number(img.dataset.i) + 1;
            img.src = next;
            return;
          }
          const ph = document.createElement("div");
          ph.className = img.className + " ph";
          ph.textContent = g ? g.title[0] || "?" : "?";
          img.replaceWith(ph);
        },
        true,
      );

      function badgesHtml(g) {
        return g.platforms
          .map(
            (p) =>
              `<span class="badge" style="--c:${color(p)}"><span class="dot"></span>${esc(name(p))}</span>`,
          )
          .join("");
      }

      const statusPills = (g) =>
        g.statuses
          .map(
            (k) =>
              `<span class="status" style="--c:var(--st-${k})">${esc(statusLabel(k))}</span>`,
          )
          .join("");

      function entriesHtml(g) {
        const picker = `<div class="status-pick">${STATUSES.map(
          ([k, label]) =>
            `<button class="chip" data-action="status" data-status="${k}" data-key="${esc(g.key)}"
       aria-pressed="${g.statuses.includes(k)}" style="--c:var(--st-${k})">${label}</button>`,
        ).join("")}</div>`;
        const r = g.rating || 0;
        const rating = `<div class="rating" role="group" aria-label="Nota">${[
          1, 2, 3, 4, 5,
        ]
          .map((n) => {
            const half = (v) =>
              `<button class="${v % 2 ? "hl" : "hr"}" data-action="rate" data-rating="${v}" data-key="${esc(g.key)}" aria-label="${ratingText(v)} estrelas" aria-pressed="${v === g.rating}"></button>`;
            return `<span class="star ${r >= 2 * n ? "on" : r === 2 * n - 1 ? "half" : ""}">★${half(2 * n - 1)}${half(2 * n)}</span>`;
          })
          .join(
            "",
          )}${g.rating ? `<span class="n">${ratingText(g.rating)}/5</span>` : ""}</div>`;
        const facts = `<div class="facts">
          <label>Desenvolvedora <input class="dev-input" data-key="${esc(g.key)}" value="${esc(g.developer)}" placeholder="Ex.: CD Projekt Red" maxlength="200"></label>
          <span class="fact-note" data-field="developer">${esc(devNote(g))}</span>
          <label>Horas jogadas <input class="hours-input" type="number" min="0" step="any" data-key="${esc(g.key)}" value="${esc(hoursValue(g))}" placeholder="0"></label>
          <span class="fact-note" data-field="hours">${esc(hoursNote(g))}</span></div>`;
        const note = `<textarea class="note-input" data-key="${esc(g.key)}" rows="3" maxlength="20000" placeholder="Anotações ou review…">${esc(g.note)}</textarea>`;
        const dates = `<div class="dates">
          <label>Início <input type="date" class="date-input" data-key="${esc(g.key)}" data-field="started" value="${esc(g.started || "")}" max="${esc(g.finished || "")}"></label>
          <label>Fim <input type="date" class="date-input" data-key="${esc(g.key)}" data-field="finished" value="${esc(g.finished || "")}" min="${esc(g.started || "")}"></label></div>`;
        const coverEdit = `<div class="cover-edit">
          <span>Capa:</span>
          <input type="url" class="cover-url" placeholder="Link da imagem…">
          <button class="link-btn" data-action="cover-url" data-key="${esc(g.key)}">Usar link</button>
          <label class="link-btn">Enviar arquivo<input type="file" class="cover-file" data-key="${esc(g.key)}" accept="image/png,image/jpeg,image/webp" hidden></label>
          ${g.custom_cover ? `<button class="link-btn" data-action="cover-clear" data-key="${esc(g.key)}">Voltar à automática</button>` : ""}</div>`;
        const options = [...new Set([...g.covers, ...g.alt_covers])];
        const coverOptions =
          options.length > 1
            ? `<div class="cover-options"><span>Capas disponíveis:</span>${options
                .map(
                  (u) =>
                    `<button class="cover-opt" data-action="cover-pick" data-key="${esc(g.key)}" data-url="${esc(u)}" aria-pressed="${u === g.covers[0]}" aria-label="Usar esta capa"><img src="${esc(u)}" alt="" loading="lazy"></button>`,
                )
                .join("")}</div>`
            : "";
        const canSplit = g.entries.length > 1;
        const hideBtn = `<button class="hide-btn" data-action="${g.hidden ? "unhide" : "hide"}" data-key="${esc(g.key)}">
    ${g.hidden ? "Mostrar de novo" : "Ocultar da lista"}</button>`;
        // Only licenses added by hand can be removed: the next sync would bring the others back.
        const removeBtns = g.entries
          .filter((e) => e.manual)
          .map((e) => {
            const label =
              g.entries.length === 1
                ? "Remover jogo"
                : `Remover cópia manual (${name(e.platform)})`;
            return `<button class="hide-btn remove" data-action="remove-manual" data-platform="${esc(e.platform)}" data-pid="${esc(e.platform_id)}" data-title="${esc(e.title)}" title="${g.entries.length === 1 ? "Apaga este jogo da biblioteca" : "Apaga da biblioteca: " + esc(e.title)}">${esc(label)}</button>`;
          })
          .join("");
        const action = `<div class="actions">${hideBtn}${removeBtns}</div>`;
        const tagEditor = `<div class="tags-edit">
    ${g.tags.map((t) => `<span class="tag">${esc(t)}<button data-action="untag" data-key="${esc(g.key)}" data-tag="${esc(t)}" aria-label="Remover tag ${esc(t)}">✕</button></span>`).join("")}
    <input class="tag-input" list="taglist" data-key="${esc(g.key)}" placeholder="+ tag" maxlength="40"></div>`;
        return (
          picker +
          rating +
          facts +
          dates +
          g.entries
            .map(
              (e) => `
    <div class="entry">
      <span class="dot" style="--c:${color(e.platform)}"></span>
      <span class="t">${esc(e.title)} <span class="hours">${esc(name(e.platform))}${e.manual ? " · adicionado à mão" : ""}</span></span>
      <span class="hours">${hours(e.playtime_minutes)}</span>
      ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">abrir</a>` : ""}
      ${
        e.split
          ? `<button class="link-btn" data-action="unsplit" data-platform="${esc(e.platform)}" data-pid="${esc(e.platform_id)}">Desfazer separação</button>`
          : canSplit
            ? `<button class="link-btn" data-action="split" data-platform="${esc(e.platform)}" data-pid="${esc(e.platform_id)}" title="Não é o mesmo jogo que os outros deste grupo">Separar</button>`
            : ""
      }
    </div>`,
            )
            .join("") +
          tagEditor +
          note +
          coverOptions +
          coverEdit +
          action
        );
      }

      function render() {
        const open = new Set(
          [...document.querySelectorAll("#list > li > details[open]")].map(
            (d) => d.dataset.key,
          ),
        );
        const list = visible();
        $("count").textContent =
          `${list.length} ${list.length === 1 ? "jogo" : "jogos"}`;
        $("list").className = view === "grid" ? "grid" : "";
        if (!list.length) {
          $("list").innerHTML =
            `<div class="empty">${showHidden ? "Nenhum jogo oculto." : "Nenhum jogo encontrado."}</div>`;
          return;
        }
        $("list").innerHTML = list
          .map((g) =>
            view === "grid"
              ? `
    <li class="${g.hidden ? "is-hidden" : ""}"><button class="card" data-key="${esc(g.key)}" title="${esc(g.title)}">
      <div class="cover">${coverHtml(g, "img")}${g.statuses.length ? `<div class="status-stack">${statusPills(g)}</div>` : ""}<div class="badges">${badgesHtml(g)}</div></div>
      <span class="title">${esc(g.title)}</span>
      ${g.rating || g.note ? `<span class="ratingline">${starsText(g.rating || 0)}${g.note ? ` <span title="Tem anotações">✎</span>` : ""}</span>` : ""}
      ${g.tags.length ? `<span class="tagline">${g.tags.map((t) => "#" + esc(t)).join(" ")}</span>` : ""}
    </button></li>`
              : `
    <li class="${g.hidden ? "is-hidden" : ""}"><details data-key="${esc(g.key)}" ${open.has(g.key) ? "open" : ""}>
      <summary>
        ${coverHtml(g, "thumb")}
        <span class="title">${esc(g.title)}</span>
        ${g.platforms.length > 1 ? `<span class="dup">×${g.platforms.length}</span>` : ""}
        <span class="badges">${statusPills(g)}${badgesHtml(g)}${g.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</span>
        ${g.rating || g.note ? `<span class="ratingline" style="padding:0">${g.rating ? "★ " + ratingText(g.rating) : ""}${g.note ? ` <span title="Tem anotações">✎</span>` : ""}</span>` : ""}
        <span class="hours hours-sum" data-key="${esc(g.key)}">${hours(g.playtime_minutes)}</span>
      </summary>
      <div class="entries">${entriesHtml(g)}</div>
    </details></li>`,
          )
          .join("");
        fitLoadedCovers();
      }

      function fillDialog(g) {
        dlgKey = g.key;
        $("dlg").innerHTML = `
    <div class="dlg-head">
      ${coverHtml(g, "thumb")}
      <div><h2>${esc(g.title)}</h2><div class="dev-line" data-key="${esc(g.key)}">${esc(g.developer)}</div><div class="badges" style="margin-top:6px">${badgesHtml(g)}</div>
        <div class="hours hours-total" data-key="${esc(g.key)}" style="text-align:left;margin-top:6px">${g.playtime_minutes ? hours(g.playtime_minutes) + " no total" : ""}</div></div>
      <button class="close" aria-label="Fechar">✕</button>
    </div>
    <div class="entries">${entriesHtml(g)}</div>`;
        fitLoadedCovers();
      }

      function openDialog(g) {
        fillDialog(g);
        $("dlg").showModal();
      }

      function setView(v) {
        view = v;
        try {
          localStorage.setItem("view", v);
        } catch {}
        $("viewGrid").setAttribute("aria-pressed", v === "grid");
        $("viewList").setAttribute("aria-pressed", v === "list");
        render();
      }

      $("viewGrid").addEventListener("click", () => setView("grid"));
      $("viewList").addEventListener("click", () => setView("list"));
      $("list").addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (card) openDialog(byKey.get(card.dataset.key));
      });
      $("dlg").addEventListener("click", (e) => {
        if (e.target === $("dlg") || e.target.closest(".close"))
          $("dlg").close();
      });
      $("showHidden").addEventListener("click", (e) => {
        showHidden = !showHidden;
        e.currentTarget.setAttribute("aria-pressed", showHidden);
        renderChips();
        render();
      });
      const post = async (path, body) =>
        (
          await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          })
        ).ok;

      // Like post(), but also returns the server's message so it can be shown to the user.
      const api = async (path, body) => {
        const r = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        return { ok: r.ok, error: r.ok ? "" : await r.text() };
      };
      const failMessage = (res) =>
        res.error && res.error !== "bad request"
          ? res.error
          : "Não foi possível salvar.";

      async function reloadKeepDialog(key) {
        await load();
        if ($("dlg").open && byKey.has(key)) fillDialog(byKey.get(key));
      }

      async function saveTags(g, tags) {
        if (!(await post("/api/tags", { key: g.key, tags }))) return;
        g.tags = tags;
        renderChips();
        render();
        if ($("dlg").open) fillDialog(g);
        document
          .querySelector(`.tag-input[data-key="${CSS.escape(g.key)}"]`)
          ?.focus();
      }

      document.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const g = byKey.get(btn.dataset.key);
        const action = btn.dataset.action;
        if (action === "untag") {
          return saveTags(
            g,
            g.tags.filter((t) => t !== btn.dataset.tag),
          );
        }
        if (action === "cover-url") {
          const url = btn
            .closest(".cover-edit")
            .querySelector(".cover-url")
            .value.trim();
          if (!url) return alert("Cole o link de uma imagem.");
          const res = await api("/api/cover", { key: g.key, url });
          if (!res.ok) return alert(failMessage(res));
          return reloadKeepDialog(g.key);
        }
        if (action === "cover-pick") {
          const res = await api("/api/cover", {
            key: g.key,
            url: btn.dataset.url,
          });
          if (!res.ok) return alert(failMessage(res));
          return reloadKeepDialog(g.key);
        }
        if (action === "cover-clear") {
          if (!(await post("/api/cover", { key: g.key, url: null }))) return;
          return reloadKeepDialog(g.key);
        }
        if (action === "remove-manual") {
          if (
            !confirm(
              `Remover "${btn.dataset.title}" da biblioteca?\n\n` +
                "Isso apaga o jogo. " +
                "Suas notas, nota, tags e status continuam guardados, caso você adicione o jogo de novo.",
            )
          )
            return;
          const res = await api("/api/manual/remove", {
            platform: btn.dataset.platform,
            platform_id: btn.dataset.pid,
          });
          if (!res.ok) return alert(failMessage(res));
          if ($("dlg").open) $("dlg").close();
          return load();
        }
        if (action === "rate") {
          const n = Number(btn.dataset.rating);
          const rating = g.rating === n ? null : n; // click the same star again to clear
          if (!(await post("/api/rating", { key: g.key, rating }))) return;
          g.rating = rating;
          render();
          if ($("dlg").open) fillDialog(g);
          return;
        }
        if (action === "status") {
          const s = btn.dataset.status; // click toggles it; others are kept
          const statuses = STATUSES.map((x) => x[0]).filter((k) =>
            k === s ? !g.statuses.includes(k) : g.statuses.includes(k),
          );
          if (!(await post("/api/status", { key: g.key, statuses }))) return;
          g.statuses = statuses;
          renderChips();
          render();
          if ($("dlg").open) fillDialog(g);
          return;
        }
        if (action === "split" || action === "unsplit") {
          // Group keys change, so everything is reloaded from the server.
          const body = {
            platform: btn.dataset.platform,
            platform_id: btn.dataset.pid,
          };
          if (!(await post("/api/" + action, body))) return;
          if ($("dlg").open) $("dlg").close();
          return load();
        }
        const hide = action === "hide";
        btn.disabled = true;
        if (
          !(await post(hide ? "/api/hide" : "/api/unhide", {
            key: g.key,
            title: g.title,
          }))
        ) {
          btn.disabled = false;
          return;
        }
        g.hidden = hide;
        if ($("dlg").open) $("dlg").close();
        renderStats();
        renderChips();
        render();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" || !e.target.classList.contains("tag-input"))
          return;
        const g = byKey.get(e.target.dataset.key);
        const raw = e.target.value.trim().replace(/\s+/g, " ");
        if (!raw) return;
        const tag = tagCase.get(raw.toLowerCase()) || raw; // reuse the spelling already in use
        if (g.tags.some((t) => t.toLowerCase() === tag.toLowerCase())) {
          e.target.value = "";
          return;
        }
        saveTags(
          g,
          [...g.tags, tag].sort((a, b) => a.localeCompare(b)),
        );
      });
      $("tagChips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-t]");
        if (!btn) return;
        selectedTags.has(btn.dataset.t)
          ? selectedTags.delete(btn.dataset.t)
          : selectedTags.add(btn.dataset.t);
        btn.setAttribute("aria-pressed", selectedTags.has(btn.dataset.t));
        render();
      });
      $("statusChips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-s]");
        if (!btn) return;
        const s = btn.dataset.s;
        if (selectedStatus.has(s)) selectedStatus.delete(s);
        else {
          if (s === "none")
            selectedStatus.clear(); // "no status" can't combine with others
          else selectedStatus.delete("none");
          selectedStatus.add(s);
        }
        renderStatusChips();
        render();
      });
      // Notes autosave shortly after typing stops, and when leaving the field or closing the dialog.
      // They never re-render the list, so typing and focus are not interrupted.
      let noteTimer = null;
      let pendingNote = null;
      async function flushNote() {
        clearTimeout(noteTimer);
        if (!pendingNote) return;
        const { key, text } = pendingNote;
        pendingNote = null;
        if (!(await post("/api/note", { key, note: text })))
          pendingNote ??= { key, text }; // keep it so the next flush retries
      }
      document.addEventListener("input", (e) => {
        if (!e.target.classList.contains("note-input")) return;
        const g = byKey.get(e.target.dataset.key);
        g.note = e.target.value;
        pendingNote = { key: g.key, text: e.target.value };
        clearTimeout(noteTimer);
        noteTimer = setTimeout(flushNote, 600);
      });
      document.addEventListener("focusout", (e) => {
        if (e.target.classList.contains("note-input")) flushNote();
      });
      $("dlg").addEventListener("close", () => {
        flushNote();
        render(); // refresh the note/rating markers on the cards
      });
      // Updates the visible bits after a developer/hours edit without re-rendering (which would drop focus).
      function patchFacts(g) {
        const set = (selector, text) =>
          document
            .querySelectorAll(selector)
            .forEach((el) => (el.textContent = text));
        const key = CSS.escape(g.key);
        set(`.dev-line[data-key="${key}"]`, g.developer);
        set(`.hours-sum[data-key="${key}"]`, hours(g.playtime_minutes));
        set(
          `.hours-total[data-key="${key}"]`,
          g.playtime_minutes ? hours(g.playtime_minutes) + " no total" : "",
        );
        document
          .querySelectorAll(`.dev-input[data-key="${key}"]`)
          .forEach((el) => {
            el
              .closest(".facts")
              .querySelector('[data-field="developer"]').textContent =
              devNote(g);
          });
        document
          .querySelectorAll(`.hours-input[data-key="${key}"]`)
          .forEach((el) => {
            el
              .closest(".facts")
              .querySelector('[data-field="hours"]').textContent = hoursNote(g);
          });
      }

      // Start/end dates save as soon as a date is picked. No re-render, so the picker keeps focus.
      document.addEventListener("change", async (e) => {
        const input = e.target;
        if (input.classList.contains("date-input")) {
          const g = byKey.get(input.dataset.key);
          const box = input.closest(".dates");
          const field = (f) => box.querySelector(`[data-field="${f}"]`);
          const started = field("started").value || null;
          const finished = field("finished").value || null;
          const res = await api("/api/dates", {
            key: g.key,
            started,
            finished,
          });
          if (!res.ok) {
            alert(failMessage(res));
            field("started").value = g.started || "";
            field("finished").value = g.finished || "";
            return;
          }
          g.started = started;
          g.finished = finished;
          field("started").max = finished || "";
          field("finished").min = started || "";
        } else if (input.classList.contains("dev-input")) {
          const g = byKey.get(input.dataset.key);
          const developer = input.value.trim();
          const res = await api("/api/developer", { key: g.key, developer });
          if (!res.ok) {
            alert(failMessage(res));
            input.value = g.developer;
            return;
          }
          g.developer_custom = developer !== "";
          g.developer = developer || g.developer_auto; // empty goes back to the automatic one
          input.value = g.developer;
          patchFacts(g);
        } else if (input.classList.contains("hours-input")) {
          const g = byKey.get(input.dataset.key);
          const raw = input.value.trim();
          const typed = raw === "" ? null : Number(raw);
          const res = await api("/api/playtime", { key: g.key, hours: typed });
          if (!res.ok) {
            alert(failMessage(res));
            input.value = hoursValue(g);
            return;
          }
          g.playtime_custom = typed !== null;
          g.playtime_minutes =
            typed !== null ? Math.round(typed * 60) : g.playtime_auto;
          input.value = hoursValue(g);
          patchFacts(g);
        } else if (input.classList.contains("cover-file")) {
          const file = input.files[0];
          if (!file) return;
          if (file.size > 5 * 1024 * 1024)
            return alert("A imagem tem mais de 5 MB.");
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          const key = input.dataset.key;
          const res = await api("/api/cover/upload", {
            key,
            data_url: dataUrl,
          });
          if (!res.ok) return alert(failMessage(res));
          reloadKeepDialog(key);
        }
      });

      // ---- add a game by hand ----
      function openAddDialog() {
        const known = new Set(["steam", "gog", "epic", "battlenet", "amazon"]);
        for (const g of groups) for (const p of g.platforms) known.add(p);
        $("addPlatform").innerHTML =
          [...known]
            .map((p) => `<option value="${esc(p)}">${esc(name(p))}</option>`)
            .join("") + '<option value="__other">Outra…</option>';
        $("addForm").reset();
        $("addOtherWrap").hidden = true;
        $("addError").hidden = true;
        $("addDlg").showModal();
        $("addTitle").focus();
      }
      $("addBtn").addEventListener("click", openAddDialog);
      $("addCancel").addEventListener("click", () => $("addDlg").close());
      $("addPlatform").addEventListener("change", () => {
        const other = $("addPlatform").value === "__other";
        $("addOtherWrap").hidden = !other;
        $("addOther").required = other;
        if (other) $("addOther").focus();
      });
      $("addForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const platform =
          $("addPlatform").value === "__other"
            ? $("addOther").value
            : $("addPlatform").value;
        const res = await api("/api/manual/add", {
          platform,
          title: $("addTitle").value,
          cover_url: $("addCover").value,
          playtime_hours: $("addHours").value,
          url: $("addUrl").value,
        });
        if (!res.ok) {
          $("addError").textContent = failMessage(res);
          $("addError").hidden = false;
          return;
        }
        $("addDlg").close();
        load();
      });
      $("addDlg").addEventListener("click", (e) => {
        if (e.target === $("addDlg")) $("addDlg").close();
      });

      $("search").addEventListener("input", render);
      $("sort").addEventListener("change", render);
      $("dupOnly").addEventListener("click", (e) => {
        dupOnly = !dupOnly;
        e.currentTarget.setAttribute("aria-pressed", dupOnly);
        render();
      });
      $("platformChips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-p]");
        if (!btn) return;
        const p = btn.dataset.p;
        selected.has(p) ? selected.delete(p) : selected.add(p);
        btn.setAttribute("aria-pressed", selected.has(p));
        render();
      });

      async function load() {
        groups = await (await fetch("/api/games")).json();
        byKey = new Map(groups.map((g) => [g.key, g]));
        renderStats();
        renderChips();
        render();
      }

      try {
        view = localStorage.getItem("view") === "list" ? "list" : "grid";
      } catch {}
      $("viewGrid").setAttribute("aria-pressed", view === "grid");
      $("viewList").setAttribute("aria-pressed", view === "list");
      load();
    </script>
  </body>
</html>
